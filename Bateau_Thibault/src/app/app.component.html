<ion-app>

<ion-menu contentId="mainContent" style="margin-top: 12%;">

  <ion-content class="menu">
    <br>
    <ion-buttons class="cta-buttons">
      <ion-button (click)="onGoToHome()" class="cta-btn primary" data-page="accueil" >Accueil</ion-button>
      <ion-button (click)="onGoToBateaux()" class="cta-btn primary">Bateaux</ion-button>
      <ion-button (click)="onGoToProduits()" class="cta-btn primary">Produits</ion-button>
      <ion-button (click)="onGoToRestaurants()" class="cta-btn primary">Restaurants</ion-button>
      <ion-button (click)="onGoToRecettes()" class="cta-btn primary ">Recettes</ion-button>
      <ion-button (click)="onGoToContact()" class="cta-btn primary">Contact</ion-button><br>
    </ion-buttons>
    
  </ion-content> 
</ion-menu>

<ion-header  id="nav">
  <ion-toolbar id="nav">
    <ion-buttons slot="start">
      <div class="logo-container">
        <div class="logo-placeholder"><img src="/assets/img/logo.png" alt="logo"></div>
        <span class="site-title">Bateau Thibault</span>
      </div>
    </ion-buttons>

    <ion-buttons slot="end">
      <ion-button class="cta-btn cart-icon" id="cartIcon" (click)="openModal()">🛒<span class="cart-count" id="cartCount">0</span></ion-button>
      <ion-menu-button autoHide="false" class="hamburger-btn"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<div id="container">
  <ion-router-outlet class="allBody" id="mainContent"></ion-router-outlet>
   <div class="floating-boat" title="Retour à l'accueil" id="floatingBoat">
   <svg viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 21c-1.39 0-2.78-.47-4-1.32-2.44 1.71-5.56 1.71-8 0C6.78 20.53 5.39 21 4 21H2v2h2c1.38 0 2.74-.35 4-.99 2.52 1.29 5.48 1.29 8 0 1.26.65 2.62.99 4 .99h2v-2h-2zM3.95 19H4c1.6 0 3.02-.88 4-2 .98 1.12 2.4 2 4 2s3.02-.88 4-2c.98 1.12 2.4 2 4 2h.05l1.9-6.68C22.23 11.28 22 10.14 22 9c0-4.42-3.58-8-8-8-3.03 0-5.66 1.67-7 4.14C5.66 2.67 3.03 1 0 1v2c2.76 0 5 2.24 5 5 0 1.14-.23 2.28-.5 3.32L3.95 19zM14 4c3.31 0 6 2.69 6 6 0 1.52-.57 2.9-1.5 3.95L17 20h-3l-1.5-6.05C11.57 12.9 11 11.52 11 10c0-3.31 2.69-6 6-6z" />
   </svg>
  </div>
</div>

</ion-app>
