
<ion-content [fullscreen]="true">
  <div id="contact" class="page">
   <section class="section">
    <h2 class="section-title">📧 Contactez-Nous</h2>
    <form class="contact-form" id="contactForm">
     <div class="form-group"><label for="name">Nom complet</label> <input type="text" id="name" name="name" required placeholder="Votre nom">
     </div>
     <div class="form-group"><label for="email">Email</label> <input type="email" id="email" name="email" required placeholder="votre@email.com">
     </div>
     <div class="form-group"><label for="requestType">Type de demande</label> <select id="requestType" name="requestType" required> <option value="">Sélectionnez...</option> <option value="info">Informations</option> <option value="reservation">Réservation</option> <option value="partenariat">Partenariat</option> <option value="autre">Autre</option> </select>
     </div>
     <div class="form-group"><label for="message">Message</label> <textarea id="message" name="message" required placeholder="Votre message..."></textarea>
     </div><button type="submit" class="form-submit">Envoyer</button>
     <div class="form-message" id="formMessage"></div>
    </form>
  
   </section>
  </div>
</ion-content>
