<ion-menu contentId="mainContent" style="margin-top: 12%;">

  <ion-content class="menu">
    <br>
    <ion-buttons class="cta-buttons">
      <ion-button (click)="onGoToHome()" class="cta-btn primary" data-page="accueil" >Accueil</ion-button>
      <ion-button (click)="onGoToBateaux()" class="cta-btn primary">Bateaux</ion-button>
      <ion-button (click)="onGoToProduits()" class="cta-btn primary">Produits</ion-button>
      <ion-button (click)="onGoToRestaurants()" class="cta-btn primary">Restaurants</ion-button>
      <ion-button (click)="onGoToRecettes()" class="cta-btn primary ">Recettes</ion-button>
      <ion-button (click)="onGoToContact()" class="cta-btn primary">Contact</ion-button>
    </ion-buttons>
  </ion-content> 
  
</ion-menu>

<ion-header  id="nav">
  <ion-toolbar>
    <ion-buttons slot="start">
      <div class="logo-container">
        <div class="logo-placeholder"><img src="/assets/img/logo.png" alt="logo"></div>
        <span class="site-title">Bateau Thibault</span>
      </div>
    </ion-buttons>

    <ion-buttons slot="end">
      <ion-button class="cta-btn cart-icon" id="cartIcon" (click)="openModal()">🛒<span class="cart-count" id="cartCount">0</span></ion-button>
      <ion-menu-button autoHide="false" class="hamburger-btn"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>








<ion-content id="container" [fullscreen]="true">
  <div id="mainContent" class="page">
   <section class="section">
    <h2 class="section-title">📧 Contactez-Nous</h2>
    <form class="contact-form" id="contactForm">
     <div class="form-group"><label for="name">Nom complet</label> <input type="text" id="name" name="name" required placeholder="Votre nom">
     </div>
     <div class="form-group"><label for="email">Email</label> <input type="email" id="email" name="email" required placeholder="votre@email.com">
     </div>
     <div class="form-group"><label for="requestType">Type de demande</label> <select id="requestType" name="requestType" required> <option value="">Sélectionnez...</option> <option value="info">Informations</option> <option value="reservation">Réservation</option> <option value="partenariat">Partenariat</option> <option value="autre">Autre</option> </select>
     </div>
     <div class="form-group"><label for="message">Message</label> <textarea id="message" name="message" required placeholder="Votre message..."></textarea>
     </div><button type="submit" class="form-submit">Envoyer</button>
     <div class="form-message" id="formMessage"></div>
    </form>
  
   </section>
  </div>
</ion-content>
